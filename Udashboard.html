<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>User Dashboard</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
  <link rel="stylesheet" href="styleU.css">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.10.5/font/bootstrap-icons.css" rel="stylesheet">

</head>
<body>
    <div id="successMessage" class="alert alert-success text-center d-none" role="alert">
        ✅ Profile updated successfully!
      </div>
      
  <div class="navbar">
    <button class="active"><i class="bi bi-person-circle"></i> My Profile</button>
    <button><i class="bi bi-receipt"></i> My Orders</button>
  </div>
  

  <!-- My Profile Section -->
  <div id="profileSection" class="section active">
    <h2 class="mb-4">My Profile</h2>
    <form id="profileForm">
      <div class="form-group">
        <label for="fullName">Full Name</label>
        <input type="text" id="fullName" class="form-control" value="John Doe" disabled>
      </div>
      <div class="form-group">
        <label for="email">Email</label>
        <input type="email" id="email" class="form-control" value="john@example.com" disabled>
      </div>
      <div class="form-group">
        <label for="address">Address</label>
        <input type="text" id="address" class="form-control" value="123, Main Street, Colombo" disabled>
      </div>

      <div class="mt-4">
        <button type="button" id="editBtn" class="btn btn-primary">Edit Profile</button>
        <button type="submit" id="saveBtn" class="btn btn-success d-none">Save Changes</button>
      </div>
    </form>
  </div>

  <!-- My Orders Section -->
  <div id="ordersSection" class="section">
    <h2 class="mb-4">My Orders</h2>
    <table class="table table-bordered">
      <thead>
        <tr>
          <th>Order ID</th>
          <th>Date</th>
          <th>Status</th>
          <th>Amount</th>
        </tr>
      </thead>
      <tbody>
        <tr>
          <td>#1001</td>
          <td>2024-04-01</td>
          <td>Delivered</td>
          <td>Rs. 4500</td>
        </tr>
        <tr>
          <td>#1002</td>
          <td>2024-04-10</td>
          <td>Processing</td>
          <td>Rs. 2800</td>
        </tr>
        <!-- Add more orders as needed -->
      </tbody>
    </table>
  </div>

  <script src="scriptU.js"></script>
</body>
</html>
