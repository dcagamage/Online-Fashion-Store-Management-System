<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Add New Admin</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
  <link rel="stylesheet" href="styleAddA.css">
</head>
<body>

<div class="container py-5">
  <h1 class="mb-4">➕ Add New Admin</h1>

  <form action="save_admin.php" method="post" id="adminForm">
    <div class="mb-3">
      <label for="adminID" class="form-label">Admin ID</label>
      <input type="text" class="form-control" id="adminID" name="adminID" required>
    </div>

    <div class="mb-3">
      <label for="adminName" class="form-label">Admin Name</label>
      <input type="text" class="form-control" id="adminName" name="adminName" required>
    </div>

    <div class="mb-3">
      <label for="email" class="form-label">Email Address</label>
      <input type="email" class="form-control" id="email" name="email" required>
    </div>

    <div class="mb-3">
      <label for="password" class="form-label">Password</label>
      <input type="password" class="form-control" id="password" name="password" required>
    </div>

    <button type="submit" class="btn btn-success">💾 Save Admin</button>
    <a href="AdminManagement.html" class="btn btn-secondary">🔙 Cancel</a>
  </form>
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
<script src="scriptAddA.js"></script>

<style>
body {
  background-color: #f9f9f9;
}

h1 {
  font-weight: bold;
  color: #333;
}

form {
  background: #fff;
  padding: 20px;
  border-radius: 10px;
  box-shadow: 0 0 10px rgba(0, 0, 0, 0.1);
}

button {
  margin-right: 10px;
}

</style>

<script>
    // scriptAddA.js

document.addEventListener("DOMContentLoaded", function() {
  const form = document.getElementById("adminForm");

  form.addEventListener("submit", function(event) {
    const email = document.getElementById("email").value;
    if (!email.includes("@")) {
      alert("Please enter a valid email address!");
      event.preventDefault(); // stop form submission
    }
  });
});

</script>


</body>

</html>
