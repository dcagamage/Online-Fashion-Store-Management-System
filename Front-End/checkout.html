<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>

<body>
    
    <link rel="stylesheet" href="checkout.css">

    <div class="container">
        <div class="checkoutLayout">
            <div class="returnCart">
                <a href="/">Keep shopping</a>
                <h1> ORDER SUMMARY</h1>
                <div class="list">
                    <div class="item">
                        <img src="C:\Users\user\Desktop\project dbms\images\watch.jpg"
                            alt="">
                        <div class="info">
                            <div class="name">PRODUCT 1</div>
                            <div class="price">$50/1 product/</div>
                        </div>
                        <div class="quantity">1</div>
                        <div class="returnPrice">$50</div>

                    </div>
                </div>
            </div>
            <div class="right">
                <h1>CHECKOUT</h1>
                <div class="form">
                    <div class="group">
                        <label for="">Full Name</label>
                        <input type="text" name="" id="">

                    </div>
                    <div class="group">
                        <label for="">phone number</label>
                        <input type="text" name="" id="">

                    </div>
                    <div class="group">
                        <label for="">Address</label>
                        <input type="text" name="" id="">

                    </div>
                    <div class="group">
                        <label for="">City</label>
                        <select name="" id="">
                            <option value="">Choose..</option>
                            <option value="Colombo">Colombo</option>

                        </select>

                    </div>
                </div>
                <div class="return">
                    <div class="row">
                        <div>Total Quantity</div>
                        <div class="totalQuantity">60</div>
                    </div>
                    <div class="row">
                        <div>Total Price</div>
                        <div class="totalPrice">$560</div>
                    </div>
                </div>
                <button class="buttonCheckout">
                    CHECKOUT
                </button>
            </div>
        </div>


    </div>



    <script src = "checkout.js"></scriptsrc></script>
</body>

</html>
