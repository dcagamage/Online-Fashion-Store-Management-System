<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>User Dashboard</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body>

<div class="container py-5">
  <h1 class="mb-4 text-center">👤 User Dashboard</h1>

  <div class="row mb-5">
    <div class="col text-center">
      <a href="#profileSection" class="btn btn-primary mx-2">📝 My Profile</a>
      <a href="#ordersSection" class="btn btn-secondary mx-2">📦 My Orders</a>
    </div>
  </div>

  <!-- My Profile Section -->
  <div id="profileSection" class="card mb-5">
    <div class="card-header bg-primary text-white">
      My Profile
    </div>
    <div class="card-body">
      <form id="profileForm">
        <div class="mb-3">
          <label for="fullName" class="form-label">Full Name</label>
          <input type="text" id="fullName" class="form-control" value="John Doe" disabled>
        </div>
        <div class="mb-3">
          <label for="email" class="form-label">Email</label>
          <input type="email" id="email" class="form-control" value="john@example.com" disabled>
        </div>
        <div class="mb-3">
          <label for="address" class="form-label">Address</label>
          <input type="text" id="address" class="form-control" value="123, Main Street, Colombo" disabled>
        </div>

        <div class="mt-4 text-center">
          <button type="button" id="editBtn" class="btn btn-warning">✏️ Edit Profile</button>
          <button type="submit" id="saveBtn" class="btn btn-success d-none">💾 Save Changes</button>
        </div>
      </form>
    </div>
  </div>

  <!-- My Orders Section -->
  <div id="ordersSection" class="card">
    <div class="card-header bg-secondary text-white">
      My Orders
    </div>
    <div class="card-body">
      <table class="table table-bordered">
        <thead class="table-dark">
          <tr>
            <th>Order ID</th>
            <th>Date</th>
            <th>Status</th>
            <th>Amount (Rs.)</th>
          </tr>
        </thead>
        <tbody>
          <tr>
            <td>#1001</td>
            <td>2024-04-01</td>
            <td>Delivered</td>
            <td>4500</td>
          </tr>
          <tr>
            <td>#1002</td>
            <td>2024-04-10</td>
            <td>Processing</td>
            <td>2800</td>
          </tr>
          <!-- More orders can be added -->
        </tbody>
      </table>
    </div>
  </div>

</div>

<script>
// Profile Edit/Save Toggle
const editBtn = document.getElementById('editBtn');
const saveBtn = document.getElementById('saveBtn');
const inputs = document.querySelectorAll('#profileForm input');

editBtn.addEventListener('click', () => {
  inputs.forEach(input => input.disabled = false);
  editBtn.classList.add('d-none');
  saveBtn.classList.remove('d-none');
});

document.getElementById('profileForm').addEventListener('submit', (e) => {
  e.preventDefault();
  inputs.forEach(input => input.disabled = true);
  saveBtn.classList.add('d-none');
  editBtn.classList.remove('d-none');

  alert('✅ Profile updated successfully!');
});
</script>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>

</body>
</html>
